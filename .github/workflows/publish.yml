name: Publish
# Fix 4: this used to be `push: branches: [main]`, which fires on every push
# to main — not just version bumps. Both `jsr publish` and `npm publish`
# error on an already-published version, so any non-release push to main
# (docs, refactors, CI tweaks) made this job red by default, and a workflow
# that's expected to fail most of the time stops being a signal. Gating on
# the GitHub Release event ties a publish attempt to an actual version bump
# (the point at which a release is cut), matching the "publish to npm on
# release" intent this workflow was originally added for.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      # JSR and npm both publish through GitHub Actions OIDC.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y iperf3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        working-directory: packages/netsu
      - run: bun run test
        working-directory: packages/netsu
      - run: bun run build
        working-directory: packages/netsu
      - run: bunx jsr publish --allow-slow-types
        working-directory: packages/netsu
      # `npx netsu` (README's headline command) only resolves once the
      # package is actually on npm — jsr publish above does not put it
      # there. `files`/`bin`/`prepublishOnly` in package.json were already
      # set up for this; nothing previously ran `npm publish`.
      - run: npm publish --provenance
        working-directory: packages/netsu

  # The Rust crate (`cargo install netsu`) publishes to crates.io on the same
  # release event. Separate job so a crates.io hiccup doesn't block the JS
  # publish and vice versa; each has its own token.
  publish-crate:
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y iperf3 libx11-dev libxtst-dev
      - name: Build the TypeScript CLI for the rs<->ts interop test
        uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: packages/netsu
      # Gate the publish on the full suite + lints passing, mirroring the JS side.
      - run: cargo fmt --check
        working-directory: netsu-rs
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: netsu-rs
      - name: Test Rust suite (retry transient network failures)
        working-directory: netsu-rs
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo test; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "cargo test failed on attempt $attempt; retrying"
          done
      - run: cargo publish
        working-directory: netsu-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Upload target-named archives to the GitHub release so `cargo binstall netsu`
  # can download the default-feature binary instead of compiling it locally.
  release-binaries:
    name: Release binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev
      - name: Install Linux cross-compilation toolchain
        if: startsWith(matrix.os, 'ubuntu')
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
          runner: none
          package: libx11-dev libxtst-dev
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: netsu
          target: ${{ matrix.target }}
          manifest-path: netsu-rs/Cargo.toml
          locked: true
          leading-dir: true
          tar: unix
          zip: windows
          checksum: sha256
